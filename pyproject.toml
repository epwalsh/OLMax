[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2-olmax"
dynamic = ["version"]
# readme = "README.md"
description = "Core JAX-based training module for the Open Language Model (OLMo)"
authors = [
    { name = "Allen Institute for Artificial Intelligence", email = "olmo@allenai.org" }
]
requires-python = ">=3.11"
# license = { file = "LICENSE" }
dependencies = [
    "jax",
    "jaxtyping",
    "equinox",
    "optax",
    "orbax-checkpoint",
    "typing-extensions",
    "dataclass-extensions>=0.2.1",
    "cached-path>=1.7.2",
    "requests",
    "packaging",
    "rich",
    "pyyaml",
]

# [project.urls]
# Homepage = "https://github.com/allenai/OLMo-core"
# Documentation = "https://olmo-core.readthedocs.io/en/latest/"
# Changelog = "https://github.com/allenai/OLMo-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "black>=23.1,<24.0",
    "isort>=5.12,<5.14",
    "pytest",
    "twine>=1.11.0",
    "setuptools",
    "wheel",
    "build",
    "boto3",
    "google-cloud-storage",
]
beaker = [
    "beaker-py>=2.0,<3.0",
    "beaker-gantry==3.0.0rc2",
]
wandb = [
    "wandb",
]
comet = [
    "comet_ml",
]
all = [
    "ai2-olmax[dev,beaker,wandb,comet]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
olmax = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "olmax.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["olmax*"]
exclude = []

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
    | scratch/
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff]
line-length = 115

[tool.ruff.lint]
ignore = ["F403", "F405", "E501"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".venv",
    "venv",
    ".mypy_cache",
    "__pycache__",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "doc",
    "pretrain_data",
    "inference",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
reportPrivateImportUsage = false

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
no_namespace_packages = true
disable_error_code = ["has-type", "import-untyped"]

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[tool.pytest.ini_options]
testpaths = "src/test/"
python_classes = [
  "Test*",
  "*Test",
]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "INFO"
log_cli = false
log_cli_level = "INFO"
markers = [
    "gpu",
]
filterwarnings = [
    'ignore::FutureWarning:huggingface_hub\.file_download',
    'ignore::DeprecationWarning:pkg_resources',
    'ignore::DeprecationWarning:google\.rpc',
    # 'ignore::FutureWarning:torch\.distributed\.checkpoint\.default_planner',
    # 'ignore::UserWarning:torch\.distributed\.checkpoint\.state_dict_saver',
    # 'ignore::UserWarning:torch\.distributed\.checkpoint\.state_dict_loader',
]
